<!DOCTYPE html>
<html lang="en">
<head>
    <title>Prediction Input</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 500px;
            text-align: center;
        }
        h1 { color: #333; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 15px;
        }
        .full-width { grid-column: span 2; }
        label { font-weight: bold; display: block; }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 18px; color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prediction Input</h1>
        <form id="predictionForm" class="form-grid">
            <div><label for="age">Age:</label><input id="age" name="age" type="number" required></div>
            <div><label for="job">Job Type:</label><input id="job" name="job" type="text" required></div>
            <div><label for="marital">Marital Status:</label><input id="marital" name="marital" type="text" required></div>
            <div><label for="education">Education Level:</label><input id="education" name="education" type="text" required></div>
            <div><label for="default">Has Default?</label><input id="default" name="default" type="text" required></div>
            <div><label for="balance">Account Balance:</label><input id="balance" name="balance" type="number" required></div>
            <div><label for="housing">Housing Loan?</label><input id="housing" name="housing" type="text" required></div>
            <div><label for="loan">Personal Loan?</label><input id="loan" name="loan" type="text" required></div>
            <div><label for="contact">Contact Type:</label><input id="contact" name="contact" type="text" required></div>
            <div><label for="day">Last Contact Day:</label><input id="day" name="day" type="number" required></div>
            <div><label for="month">Last Contact Month:</label><input id="month" name="month" type="text" required></div>
            <div><label for="duration">Call Duration:</label><input id="duration" name="duration" type="number" required></div>
            <div><label for="campaign">Campaign Contacts:</label><input id="campaign" name="campaign" type="number" required></div>
            <div><label for="pdays">Days Since Last Contact:</label><input id="pdays" name="pdays" type="number" required></div>
            <div><label for="previous">Previous Contacts:</label><input id="previous" name="previous" type="number" required></div>
            <div><label for="poutcome">Previous Outcome:</label><input id="poutcome" name="poutcome" type="text" required></div>
            <div class="full-width"><button type="submit">Predict</button></div>
        </form>
        <p id="result"></p>
    </div>

    <script>
       document.getElementById("predictionForm").onsubmit = async function(event) {
            event.preventDefault();

            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    'age': document.getElementById('age').value,
                    'job': document.getElementById('job').value,
                    'marital': document.getElementById('marital').value,
                    'education': document.getElementById('education').value,
                    'default': document.getElementById('default').value,
                    'balance': document.getElementById('balance').value,
                    'housing': document.getElementById('housing').value,
                    'loan': document.getElementById('loan').value,
                    'contact': document.getElementById('contact').value,
                    'day': document.getElementById('day').value,
                    'month': document.getElementById('month').value,
                    'campaign': document.getElementById('campaign').value,
                    'pdays': document.getElementById('pdays').value,
                    'previous': document.getElementById('previous').value,
                    'poutcome': document.getElementById('poutcome').value
                })
            });

           const result = await response.json();

            if (result.error) {
                document.getElementById("result").innerText = `Error: ${result.error}`;
            } else {
                const predictionValue = result.prediction[0]; // assuming result.prediction is a list like [0] or [1]
                const predictionText = predictionValue === 0 ? "No" : "Yes";
                document.getElementById("result").innerText = `Prediction: ${predictionText}`;
            }

        };

    </script>
</body>
</html>
